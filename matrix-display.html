<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker - Matrix Display Simulator</title>
    <link rel="stylesheet" href="matrix-styles.css">
</head>
<body>
    <div class="simulator-container">
        <h1>Simulazione Display Matrice LED P2.5 (64x32)</h1>
        <p class="subtitle">Due display affiancati = 128x32 pixel</p>
        
        <!-- Simulazione display doppio -->
        <div class="matrix-display-container">
            <canvas id="matrixCanvas" width="128" height="32"></canvas>
        </div>

        <!-- Controlli simulazione -->
        <div class="controls">
            <h2>Controlli Test</h2>
            <div class="control-group">
                <label>Codice Fermata:</label>
                <input type="text" id="testStopCode" value="3258" placeholder="3258">
                <button id="testBtn">Test Fermata</button>
            </div>
            <div class="control-group">
                <button id="demoBtn">Demo Automatica</button>
                <button id="stopDemoBtn">Ferma Demo</button>
            </div>
        </div>

        <!-- Info display -->
        <div class="info">
            <h3>Specifiche Display</h3>
            <ul>
                <li><strong>Risoluzione singolo:</strong> 64x32 pixel</li>
                <li><strong>Risoluzione doppio:</strong> 128x32 pixel</li>
                <li><strong>Pixel pitch:</strong> P2.5 (2.5mm)</li>
                <li><strong>Colori:</strong> RGB (16 milioni di colori)</li>
            </ul>
        </div>
    </div>

    <!-- Carica config.example.js come base, poi config.production.js per produzione -->
    <!-- config.js viene caricato solo se esiste (sviluppo locale) -->
    <script src="config.example.js"></script>
    <script src="config.production.js"></script>
    <script>
        // Prova a caricare config.js solo se siamo in sviluppo locale
        // Su Vercel/produzione, config.js non esiste quindi non lo carichiamo
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            const configScript = document.createElement('script');
            configScript.src = 'config.js';
            configScript.onerror = function() {
                // config.js non esiste, va bene, usiamo config.production.js
                console.log('config.js non trovato, usando config.production.js');
            };
            document.head.appendChild(configScript);
        }
    </script>
    <script src="tmb-api.js"></script>
    <script src="pixel-font.js"></script>
    <script src="matrix-display.js"></script>
</body>
</html>
