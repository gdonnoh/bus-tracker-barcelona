<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker Barcelona - TMB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚌 Bus Tracker Barcelona</h1>
            <p class="subtitle">Trova la fermata più vicina e i prossimi arrivi</p>
        </header>

        <div class="main-content">
            <!-- Sezione ricerca fermata -->
            <section class="search-section">
                <button id="findNearestBtn" class="btn-primary">
                    📍 Trova Fermata Più Vicina
                </button>
                <div id="locationStatus" class="status-message"></div>
            </section>

            <!-- Sezione fermata trovata -->
            <section id="stopInfo" class="stop-info hidden">
                <h2>Fermata Trovata</h2>
                <div class="stop-details">
                    <div class="stop-name" id="stopName"></div>
                    <div class="stop-code" id="stopCode"></div>
                    <div class="stop-distance" id="stopDistance"></div>
                </div>
            </section>

            <!-- Sezione arrivi bus -->
            <section id="arrivalsSection" class="arrivals-section hidden">
                <h2>Prossimi Arrivi</h2>
                <div id="arrivalsList" class="arrivals-list"></div>
                <div id="loadingArrivals" class="loading hidden">Caricamento...</div>
                <div id="errorMessage" class="error hidden"></div>
            </section>

            <!-- Sezione ricerca manuale -->
            <section class="manual-search">
                <h3>Oppure cerca per codice fermata</h3>
                <div class="search-box">
                    <input type="text" id="stopCodeInput" placeholder="Es: 3258" maxlength="10">
                    <button id="searchByCodeBtn" class="btn-secondary">Cerca</button>
                </div>
            </section>
        </div>

        <footer>
            <p>Dati forniti da TMB - Transports Metropolitans de Barcelona</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="tmb-api.js"></script>
    <script src="app.js"></script>
</body>
</html>
